[package]
name = "morpholog-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "morpholog"
path = "src/main.rs"

[dependencies]
morpholog-core = { path = "../morpholog-core" }
morpholog-postgres = { path = "../morpholog-postgres" }
morpholog-surface = { path = "../morpholog-surface" }
morpholog-witness = { path = "../morpholog-witness" }
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
jiff = { workspace = true }
rust_decimal = { workspace = true }
base64 = { workspace = true }
# The timestamp-authority exchange, rustls only: no OpenSSL, no async
# client stack for one POST per checkpoint.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
# Tests only: the binary stays file-path-driven and bundles no
# programmes. The all-examples check iterates the generated registry
# instead of re-walking examples/ with its own heuristic.
morpholog-examples = { path = "../morpholog-examples" }
sqlx = { workspace = true }
tempfile = "3"

[lints]
workspace = true
