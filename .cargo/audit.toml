# cargo-audit configuration.
#
# Each ignored advisory MUST carry a written reason explaining why it
# does not affect us. Future advisories - including ones in features
# we DO use - should still fail CI; this file is for documented false
# positives only.

[advisories]
ignore = [
    # C SQLite CVE in libsqlite3-sys 0.37, a lockfile entry through
    # sqlx-sqlite. We enable sqlx's `postgres` feature and not
    # `sqlite`: `cargo tree -i libsqlite3-sys` prints nothing, so the
    # crate is never compiled. sqlx-sqlite 0.9.0 is current and holds
    # libsqlite3-sys below the fixed 0.39; revisit when sqlx moves.
    "RUSTSEC-2026-0459",
]
