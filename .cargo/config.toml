# sqlx query macros verify against the committed `.sqlx/` offline cache, so
# every cargo invocation in this workspace builds with no database by default
# - a plain `cargo build`, precommit, and CI all read the cache, not a live DB.
#
# Cache regeneration (`scripts/sqlx-prepare.sh`) and the CI/precommit freshness
# check set a real `SQLX_OFFLINE=false`, which takes precedence over this
# `[env]` default and makes those steps verify against the live schema.
[env]
SQLX_OFFLINE = "true"

# The PG-backed integration suites share one database and TRUNCATE it on
# entry, so they only pass single-threaded. Precommit passes --test-threads=1
# explicitly; this makes a plain `cargo test` safe too. Total test runtime is
# sub-second, so serial execution costs nothing.
RUST_TEST_THREADS = "1"
