# sqlx query macros verify against the committed `.sqlx/` offline cache, so
# every cargo invocation in this workspace builds with no database by default
# - a plain `cargo build`, precommit, and CI all read the cache, not a live DB.
#
# Cache regeneration (`scripts/sqlx-prepare.sh`) and the CI/precommit freshness
# check set a real `SQLX_OFFLINE=false`, which takes precedence over this
# `[env]` default and makes those steps verify against the live schema.
[env]
SQLX_OFFLINE = "true"

# The PG-backed integration suites share one database and TRUNCATE it on
# entry, so they only pass single-threaded. Every `cargo test` here runs them
# so: CI and a plain local run alike. The local gate runs the test binaries
# side by side instead, each PG-backed one on a database of its own
# (scripts/test_lanes.sh), and each still one test at a time.
RUST_TEST_THREADS = "1"

# `cargo update` skips any version published in the last week, so a
# hijacked release has time to be found before it reaches the lockfile.
# For an urgent fix to one crate:
#   CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update <crate> --precise <version>
[registry]
global-min-publish-age = "7 days"
