[workspace]
resolver = "3"
members = [
    "crates/morpholog-bench",
    "crates/morpholog-cli",
    "crates/morpholog-core",
    "crates/morpholog-examples",
    "crates/morpholog-outbox",
    "crates/morpholog-postgres",
    "crates/morpholog-surface",
    "crates/morpholog-test-support",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/jordan-dimov/morpholog"

[workspace.dependencies]
rust_decimal = { version = "1", features = ["serde-with-str"] }
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "rust_decimal", "json", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
thiserror = "2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
rand = "0.9"
chumsky = "0.10"
ariadne = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
# A stub left in shipped code is a bug; neither has a legitimate use in
# tests either. `panic` is the sharper guard but fires on test-helper
# assertions, so it is scoped to the kernel crate root instead (a panic
# on adversarial input there is a liability, not a bug report).
todo = "warn"
unimplemented = "warn"
# The high-signal residue of a full `clippy::pedantic` survey; the rest
# of the group is noise here (must_use / doc-markdown churn, length
# counters, cast lints that only fire on the bench's legitimate float
# stats). Each of these either catches a real bug class or enforces an
# edition-2024 idiom the codebase already follows.
zero_sized_map_values = "warn"               # a Map<K, ()> is a Set in disguise
manual_let_else = "warn"
match_wildcard_for_single_variants = "warn"  # `_` hiding one named variant defeats exhaustiveness
uninlined_format_args = "warn"
redundant_closure_for_method_calls = "warn"
single_char_pattern = "warn"
stable_sort_primitive = "warn"
