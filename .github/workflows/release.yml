# Prebuilt-binary release channel: one packaged `morpholog` per
# supported platform on tag push, with the same build/smoke/package
# pipeline dry-run on any PR that touches it - so the first real tag is
# never the first execution.
#
# Intel macOS is deliberately absent: GitHub retired the free
# `macos-13` label, and the Intel images that replaced it are billed
# larger runners. Every Mac sold since late 2020 is Apple Silicon, and
# an Intel Mac cannot run an arm64 binary, so those users take the
# source build - which the install guide names rather than leaving
# them to discover a missing asset.
#
# Every target builds on a runner of its own architecture rather than
# cross-compiling. The dependency tree reaches C and assembly (`ring`),
# so cross-linking would need a C toolchain per target - and, more to
# the point, a cross-built artifact cannot run its own smoke test. A
# binary nobody has executed is not a release asset.
#
# Three jobs on purpose: the tag guard answers a question about the TAG
# and runs once; the build matrix (which PRs can reach, and whose steps
# a PR can edit) holds a read-only token; only the tag-gated publish
# job gets `contents: write`, and it consumes the packaged artifacts
# rather than rebuilding. Actions are pinned to commit SHAs
# (not tags): this workflow publishes an executable artifact, so its
# inputs are immutable by policy even though ci.yml uses the friendlier
# tags.
name: release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/morpholog-cli/**"
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  # A property of the tag, not of any target: checked once, before four
  # runners spend anything.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The ancestor-of-main check needs real history.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          # This job reads the workspace version with cargo, so it
          # pins its toolchain too rather than trusting whatever the
          # runner image happens to preinstall.
          toolchain: "1.95.0"

      - name: The tag names the workspace version and sits on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "morpholog-cli") | .version')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG does not match crate version $VERSION" >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tagged commit is not on main" >&2
            exit 1
          fi

  build:
    needs: guard
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      # One platform failing must not deny the others their evidence:
      # a matrix that stops at the first red hides whether the rest
      # would have packaged.
      fail-fast: false
      matrix:
        include:
          # The asset that already exists. Its name, target and
          # toolchain are unchanged on purpose - a consumer pins its
          # checksum, so this must not be rebuilt differently as a side
          # effect of gaining siblings.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            static: true
            arch: x86-64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            static: true
            arch: ARM aarch64
          - target: aarch64-apple-darwin
            runner: macos-latest
            static: false
            arch: arm64
            # Apple's current linker asserts on very long mangled
            # symbol names, and the parser crate's combinator types
            # monomorphise into some of the longest in the workspace.
            # The classic linker has no such limit.
            rustflags: "-C link-arg=-Wl,-ld_classic"
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          # The workspace floor, pinned exactly: a release artifact is
          # built by a named compiler, not whichever stable is current.
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}

      - name: musl toolchain
        if: matrix.static
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (static; sqlx verifies against the committed offline cache)
        run: cargo build --release --locked --target "$TARGET" -p morpholog-cli

      # Every asset answers for itself, on its own architecture. The
      # linkage claim differs by platform and the check follows: a musl
      # build must be genuinely static (that is the promise - no glibc
      # version to match), while macOS has no static libc, so the claim
      # there is that it is a Mach-O for the right architecture and
      # links only against system libraries.
      - name: The artifact links as promised and answers
        run: |
          BIN="target/$TARGET/release/morpholog"
          strip "$BIN"
          file "$BIN"
          # One asset per platform means the bytes must BE that
          # platform: a toolchain misconfiguration that quietly built
          # the host architecture would otherwise ship under the wrong
          # name.
          file "$BIN" | grep -q '${{ matrix.arch }}' || {
            echo "the binary is not ${{ matrix.arch }}" >&2
            exit 1
          }
          if [ "${{ matrix.static }}" = "true" ]; then
            file "$BIN" | grep -Eq 'statically linked|static-pie' || {
              echo "the binary is not statically linked" >&2
              exit 1
            }
          else
            file "$BIN" | grep -q 'Mach-O 64-bit executable' || {
              echo "the binary is not a 64-bit Mach-O executable" >&2
              exit 1
            }
            # Nothing from Homebrew or any other non-system prefix: a
            # download must not need a package manager to run.
            otool -L "$BIN"
            otool -L "$BIN" | tail -n +2 | grep -vE '^\s+/usr/lib/|^\s+/System/' && {
              echo "the binary links a non-system library" >&2
              exit 1
            }
          fi
          "$BIN" --version
          "$BIN" check examples/01_settlement_netting/netting.morph

      - name: Package with checksum
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)     LABEL="$GITHUB_REF_NAME" ;;
            refs/heads/main) LABEL="main" ;;
            *)               LABEL="dryrun" ;;
          esac
          NAME="morpholog-$LABEL-$TARGET"
          mkdir "$NAME"
          cp "target/$TARGET/release/morpholog" LICENSE "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
          # macOS images carry `shasum`, not `sha256sum`. Both emit the
          # same "<hash>  <file>" line, so a consumer verifies either
          # asset with whichever tool they have.
          if command -v sha256sum >/dev/null; then SHA256="sha256sum"; else SHA256="shasum -a 256"; fi
          $SHA256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          $SHA256 -c "$NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package-${{ matrix.target }}
          path: |
            morpholog-*.tar.gz
            morpholog-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-package-*
          merge-multiple: true

      # A glob is only as good as what it matched: an empty expansion
      # would publish a release carrying no assets at all, and the
      # first person to notice would be someone trying to download one.
      - name: Every declared platform produced an asset
        run: |
          LABEL="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/heads/main) LABEL="main" ;; esac
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
                        aarch64-apple-darwin; do
            for suffix in tar.gz tar.gz.sha256; do
              test -f "morpholog-$LABEL-$target.$suffix" || {
                echo "missing asset: morpholog-$LABEL-$target.$suffix" >&2
                exit 1
              }
            done
          done
          sha256sum -c morpholog-"$LABEL"-*.tar.gz.sha256

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Prebuilt binaries for linux (x86_64, arm64) and macOS (Apple Silicon). Install guide: docs/install.md (select by uname -s / uname -m, verify the checksum; the worked examples ship in the source archive below, no Rust toolchain needed). Intel Macs build from source - GitHub retired the free Intel runner." \
            morpholog-"$GITHUB_REF_NAME"-*.tar.gz \
            morpholog-"$GITHUB_REF_NAME"-*.tar.gz.sha256

      # The rolling channel a fast-moving embedder tracks between
      # versioned releases: one prerelease, recreated on every main
      # push, download URL stable. The binary reports the workspace
      # version regardless of later commits - the release notes carry
      # the exact commit, which is the artifact's true identity here.
      - name: Publish the rolling main prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete main-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create main-latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "main (rolling)" \
            --notes "Rolling build of main at $GITHUB_SHA. Recreated on every merge; not a versioned release - pin a v* tag for anything durable. Install guide: docs/install.md." \
            morpholog-main-*.tar.gz \
            morpholog-main-*.tar.gz.sha256
