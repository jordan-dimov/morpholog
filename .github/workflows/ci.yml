name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  fmt-clippy:
    name: fmt + clippy + doc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: fmt-clippy

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: rustdoc (catch broken intra-doc links)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Pre-built binary download (~5s) instead of compiling cargo-audit
      # from source (~3 min) on every run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  test:
    name: test (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # 17 is the stated floor; 18 is what hosted embedders (the
        # Glasshouse demo) already run on.
        postgres: [17, 18]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The same rust-lld memory bounds the coverage job carries.
      # Serialising lld caps each link's internal parallelism, but
      # cargo still links several test binaries concurrently, and with
      # full debuginfo the combined peak still intermittently SIGBUSes
      # the hosted runner (it has taken out pg-17 and pg-18 runs on
      # different days). line-tables-only cuts each link's footprint
      # several-fold while test backtraces keep file/line info.
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1 -C debuginfo=line-tables-only"

    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Apply Morpholog schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -f crates/morpholog-core/sql/schema.sql

      # Sync, pure crates - no DB, parallel.
      - name: test (core, parallel)
        run: cargo test -p morpholog-core --all-targets --locked

      - name: test (examples, parallel)
        run: cargo test -p morpholog-examples --all-targets --locked

      # Parser arc: lexer, layout, parser, formatter round-trip.
      # No DB; the round-trip property test lives here.
      - name: test (surface, parallel)
        run: cargo test -p morpholog-surface -p morpholog-test-support --all-targets --locked

      # PG-backed integration tests share one schema; each test
      # truncates it on entry, so they must run serially.
      - name: test (cli, serial)
        run: cargo test -p morpholog-cli --all-targets --locked -- --test-threads=1

      - name: test (postgres, serial)
        run: cargo test -p morpholog-postgres --all-targets --locked -- --test-threads=1

      - name: test (outbox, serial)
        run: cargo test -p morpholog-outbox --all-targets --locked -- --test-threads=1

      # Scale-pressure bench: the N=1 compatibility smoke test only.
      # It runs every scenario once against the schema, so drift in the
      # bench's hand-written SQL fails here instead of the next manual
      # scale run. Truncates the schema, hence serial.
      - name: test (bench smoke, serial)
        run: cargo test -p morpholog-bench --all-targets --locked -- --test-threads=1

  python-client:
    name: python client (3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: python-client

      # Pinned to EXACTLY the floor the generated client declares.
      # The floor is enforcement, not preference: the templates emit a
      # conservative Python subset, and this job is what catches a
      # newer-version idiom sneaking in (the Z-suffix fromisoformat
      # trap is the canonical example).
      - name: Install Python at the declared floor
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build the CLI
        run: cargo build -p morpholog-cli --locked

      # The committed package under the worked embedder must be exactly
      # what this binary generates - regenerate-and-diff is the drift
      # contract embedders themselves rely on.
      - name: Regenerate the example client and diff
        run: |
          target/debug/morpholog generate python-client \
            examples/10_trade_lifecycle/trade_lifecycle.morph \
            --out examples/etrm_embedder
          git diff --exit-code examples/etrm_embedder/morpholog_client

      - name: Template unit tests (same goldens as the Rust contract test)
        run: python -m unittest discover crates/morpholog-cli/templates/python_client/tests

      - name: Worked embedder end to end
        env:
          MORPHOLOG_BIN: ${{ github.workspace }}/target/debug/morpholog
          PGPASSWORD: postgres
        run: python examples/etrm_embedder/etrm_lifecycle.py

  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      # The hosted runner's free disk cannot hold the instrumented
      # workspace beside the preinstalled toolchains this job never
      # touches; the test-binary count tipped it into "No space left
      # on device". Clearing the unused toolchains buys ~25 GB.
      - name: Free runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - name: Install stable toolchain with llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      # Pre-built binary download instead of compiling from source.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Apply Morpholog schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -f crates/morpholog-core/sql/schema.sql

      # Coverage runs the full workspace test suite under llvm-cov.
      # PG-backed tests share one schema and must run serially.
      # No threshold gating - the summary is a visibility tool, not
      # a merge gate, so a coverage dip is a review prompt rather
      # than a hard fail.
      #
      # `--threads=1` on the linker caps rust-lld's internal parallel
      # section: linking the coverage-instrumented binaries (debuginfo
      # + instrumentation tables, one per test binary) peaks memory hard
      # enough that lld's parallelFor SIGBUSes on the runner. Serialising
      # lld bounds peak memory at a modest link-time cost; the rest of
      # the build stays parallel.
      #
      # `debuginfo=line-tables-only` bounds the disk the same build
      # writes: full DWARF dominates instrumented binary size, while
      # coverage mapping lives in its own section and keeps line-level
      # reporting intact - the summary is unchanged, the target
      # directory shrinks by gigabytes.
      - name: cargo llvm-cov
        env:
          RUSTFLAGS: "-C link-arg=-Wl,--threads=1 -C debuginfo=line-tables-only"
        run: cargo llvm-cov --workspace --locked --summary-only -- --test-threads=1
