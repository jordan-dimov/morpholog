name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  fmt-clippy:
    name: fmt + clippy + doc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: fmt-clippy

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: rustdoc (catch broken intra-doc links)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Pre-built binary download (~5s) instead of compiling cargo-audit
      # from source (~3 min) on every run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  test:
    name: test (with postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Apply Morpholog schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -f crates/morpholog-core/sql/schema.sql

      # Sync, pure crates - no DB, parallel.
      - name: test (core, parallel)
        run: cargo test -p morpholog-core --all-targets --locked

      - name: test (examples, parallel)
        run: cargo test -p morpholog-examples --all-targets --locked

      # Parser arc: lexer, layout, parser, formatter round-trip.
      # No DB; the round-trip property test lives here.
      - name: test (surface, parallel)
        run: cargo test -p morpholog-surface -p morpholog-test-support --all-targets --locked

      # PG-backed integration tests share one schema; each test
      # truncates it on entry, so they must run serially.
      - name: test (cli, serial)
        run: cargo test -p morpholog-cli --all-targets --locked -- --test-threads=1

      - name: test (postgres, serial)
        run: cargo test -p morpholog-postgres --all-targets --locked -- --test-threads=1

      - name: test (outbox, serial)
        run: cargo test -p morpholog-outbox --all-targets --locked -- --test-threads=1

  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain with llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      # Pre-built binary download instead of compiling from source.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Apply Morpholog schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -f crates/morpholog-core/sql/schema.sql

      # Coverage runs the full workspace test suite under llvm-cov.
      # PG-backed tests share one schema and must run serially.
      # No threshold gating - the summary is a visibility tool, not
      # a merge gate, so a coverage dip is a review prompt rather
      # than a hard fail.
      - name: cargo llvm-cov
        run: cargo llvm-cov --workspace --locked --summary-only -- --test-threads=1
